<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hofplaner</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root{--ink:#1f2a24;--bg:#f4f5ef;--card:#fff;--line:#d8dccf;--green:#2d5a3d;--red:#b3261e;--muted:#667068;box-sizing:border-box}
*{box-sizing:inherit}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:210px 1fr;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
h1,h2,.logo{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:700}
h1{font-size:2rem;margin:.2em 0 .6em}h2{font-size:1.25rem;margin:1.4em 0 .5em}
nav{background:var(--green);color:#fff;padding:1.2rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
#bar{display:none}
.logo{font-size:1.5rem;padding:0 .6rem 1rem;display:flex;align-items:center;gap:.7rem}.logo img{width:52px;height:auto;flex:none}.lg h1{text-align:center}.lgi{display:block;width:110px;height:auto;margin:0 auto 1rem}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.5rem 1rem;margin:.3rem 0 .6rem}.pk{display:flex;gap:.4rem;align-items:flex-start;flex-wrap:wrap}.pk small{display:block;width:100%;margin-left:1.7rem;color:var(--muted)}#pr img.pi{height:44px;width:44px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:.5rem}#pr td{vertical-align:middle}#pr tr{break-inside:avoid}.catH{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}.opi{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}#pr table.cat{table-layout:fixed;font-size:.95rem}#pr table.cat td:first-child{width:60px}#pr table.cat td:last-child{width:9rem}#pr table.ex{font-size:.7rem;width:100%;border-collapse:collapse}#pr table.ex th,#pr table.ex td{border:1px solid #999;padding:.15rem .3rem;text-align:left}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#dfe9e1;font:inherit;padding:.6rem .7rem;border-radius:6px;cursor:pointer}
nav button.on{background:#fff;color:var(--green);font-weight:600}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e0a800;outline-offset:1px}
main{padding:1.5rem 2rem 4rem;max-width:900px;width:100%;min-width:0}
button,.btn{font:inherit;padding:.45rem .9rem;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:6px;cursor:pointer}
button.ghost{background:none;color:var(--green)}
button.x{background:none;border:0;color:var(--muted);font-size:1.3rem;padding:0 .4rem}
input,select{font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 1rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.3rem 0}
ul.tl{list-style:none;padding:0;margin:0}
.task{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:.6rem;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin-bottom:.4rem}
.task.ev{border-left-color:var(--red)}.task.ev span{color:var(--red);font-weight:600}
.task.done{opacity:.45}.task.done span{text-decoration:line-through}
.task input[type=checkbox]{width:1.3rem;height:1.3rem}
small{display:block;color:var(--muted)}
table{border-collapse:collapse;width:100%}td,th{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.dim{opacity:.45}.pr{width:5.5rem;text-align:right}.av label{display:inline-block;margin-right:.6rem;font-size:.85rem}
.sum{font-weight:700;font-size:1.1rem}
.done-o{opacity:.5}
.empty{color:var(--muted);padding:.5rem 0}
.prow{display:grid;grid-template-columns:56px 1fr auto 11rem auto;gap:.3rem .8rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){
 body{grid-template-columns:1fr;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
 nav{display:none;position:fixed;inset:0 0 calc(56px + env(safe-area-inset-bottom,0px)) 0;height:auto;z-index:6;overflow-y:auto;padding:1rem}
 body.more nav{display:flex}
 #bar{display:flex;position:fixed;inset:auto 0 0 0;background:var(--green);padding:.2rem .2rem calc(.2rem + env(safe-area-inset-bottom,0px));z-index:7}
 #bar button{flex:1;background:none;border:0;border-radius:6px;color:#dfe9e1;padding:.75rem .1rem;font-size:.75rem}
 #bar button.on{background:#fff;color:var(--green);font-weight:600}
 main{padding:1rem 1rem 2rem}.task{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .6rem}.task>div{flex:1;min-width:0}.task>span:empty{display:none}.task select{order:9;flex:1 1 100%;margin-left:2rem;max-width:14rem}
 nav button{padding:.55rem .7rem}
 .prow{grid-template-columns:56px 1fr}.prow .n,.prow .av2,.prow>.x{grid-column:2}.prow>.x{justify-self:start}
}
h3{font-size:1rem;margin:1rem 0 .3rem}details{margin:.4rem 0}summary{cursor:pointer;font-weight:600;padding:.3rem 0}details.sub{margin-left:1rem}
.job{border-top:1px solid var(--line);padding:.5rem 0}.job.inkv{background:#fff6dd}
.tag{font-size:.75rem;background:#fff6dd;border:1px solid #e0c36a;border-radius:99px;padding:.05rem .5rem}
.pr.ind{background:#fff6dd;border-color:#c99a00;font-weight:700}
.calnav{display:flex;align-items:center;gap:.5rem;margin:.6rem 0}.calnav h2{margin:0;flex:1;text-align:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:1rem}
.cg .wd{font-size:.8rem;color:var(--muted);text-align:center;padding:.2rem 0;font-weight:600}
.cd{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:5.6rem;padding:.25rem;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-align:left;font:inherit;cursor:pointer;overflow:hidden;min-width:0}
.cd.leer{background:transparent;border-color:transparent;cursor:default}
.cd.heute{border:2px solid var(--green)}.cd.sel{background:#eef3ea;outline:2px solid #e0a800}
.cd b{font-size:.85rem}.cd.heute b{color:var(--green)}
.ce{font-size:.72rem;background:#fbe3e1;color:var(--red);border-radius:4px;padding:0 .25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce.ar{background:#e3eedc;color:var(--green)}.ce.jb{background:#dde8f3;color:#1f4e79}.ce.od{background:#fdecc8;color:#7a4b00}.task.od{border-left-color:#d9930d}.task.od span{color:#7a4b00;font-weight:600}.task.jb{border-left-color:#2c6aa0}.task.jb span{color:#2c6aa0;font-weight:600}.tc{display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:center}.tc label{display:inline-flex;gap:.3rem;align-items:center}.task .tc select{flex:none;order:0;margin:0;width:auto;max-width:9.5rem}.ce.done{opacity:.45;text-decoration:line-through}
.cm{font-size:.72rem;color:var(--muted)}
@media(max-width:760px){.cd{min-height:3.6rem}.ce{font-size:0;height:.45rem;padding:0;border-radius:99px;background:var(--red)}.ce.ar{background:var(--green)}.ce.jb{background:#2c6aa0}.ce.od{background:#d9930d}.ce.done{background:#d9a6a2}.cm{display:none}}
textarea{font:inherit;width:100%;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;margin:.3rem 0;background:#fff}
.pre{white-space:pre-wrap;margin:.2rem 0 .6rem}
.ph{position:relative;display:flex;width:56px;height:56px;border:1px dashed var(--line);border-radius:6px;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--muted);font-size:.75rem;background:#fff}
.ph img{width:100%;height:100%;object-fit:cover}.ph:focus-within{outline:3px solid #e0a800}
.ph input{position:absolute;opacity:0;width:1px;height:1px}
.fl{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:.1rem}
#pr{display:none}
.dt{font:inherit;font-size:.8rem;padding:.1rem .3rem;max-width:9.5rem}.prow[hidden]{display:none}.prow>*{min-width:0}.prow.dim{opacity:.5}.prow .nm{font-weight:600}.prow select{width:100%;max-width:calc(100% - 4px)}

.gh{font-size:.75rem;opacity:.7;padding:1rem .7rem .2rem}
.nf{margin-top:auto;padding-top:1rem}.stat{font-size:.75rem;padding:.3rem .7rem;opacity:.85}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:1rem 0}
.stc{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;background:#fff;color:var(--ink);border:1px solid var(--line);padding:.7rem .8rem;border-radius:10px;text-align:left}
.stc b{font:700 1.9rem/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif;color:var(--green)}.stc span{font-size:.85rem;color:var(--muted)}
body.login{display:block}body.login nav,body.login #bar{display:none}
.lg{max-width:24rem;margin:8vh auto;padding:0 1rem}.lg input{width:100%}.err{color:var(--red);font-weight:600}
.urow{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center}

@media print{body>*:not(#pr){display:none!important}#pr{display:block}body{display:block;background:#fff}}
</style>
</head>
<body>
<nav id="nav" aria-label="Hauptmenü"></nav>
<div id="bar"></div>
<main id="main"></main>
<div id="pr"></div>
<script>
const K='hofplaner-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _u=0;const uid=()=>Date.now().toString(36)+((_u=(_u+1)%1296).toString(36).padStart(2,'0'))+Math.random().toString(36).slice(2,5);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const days=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const fmtD=d=>d.split('-').reverse().join('.');
const nf=x=>Number(x).toLocaleString('de-DE',{maximumFractionDigits:2,minimumFractionDigits:2});
const num=s=>parseFloat(String(s).replace(',','.'));
const PL={1:'Hohe Priorität',2:'Mittlere Priorität',3:'Niedrige Priorität'};

function seed(){
 const P=[];const add=(cat,unit,list)=>list.forEach(([n,p])=>P.push({id:uid(),cat,name:n,price:p,unit,avail:'ja',changed:null}));
 add('Speck','kg',[['Bauchspeck',32],['Schlegelspeck',34],['Speck vom Kaiserteil',null],['Karreespeck',null],['Schulterspeck',null],['Nackenspeck',null],['Seitenspeck',null]]);
 add('Kaminwurz','Stk',[['Rindkaminwurz 120 g (2/3 Rind)',2.1],['Hirschkaminwurz 120 g',2.6],['Wildschwein 120 g',2.6],['Frische Hauswurst 120 g',2],['Grillwürstchen 60 g',1.2],['Geräucherte Hauswurst 120 g',2]]);
 add('Salami','kg',[['Bauernsalami (2/3 Rind)',35.5],['Hirschsalami',43],['Schweinesalami',34],['Wildschweinsalami',39.5]]);
 add('Geräuchertes','kg',[['Geräuchertes Rindfleisch',43.5],['Geräuchertes Hirschfleisch',59.5],['Geräuchertes Schweinefilet',50.5]]);
 add('Käse','kg',[['Alm-Käse',24.5],['Alm-Butter',22]]);
 add('Frischfleisch','kg',[['Rindfleisch',null],['Hirschfleisch',null],['Schweinefleisch',null]]);
 add('Frischfleisch','Stk',[['Kalbsragù 350 g',8.9]]);
 add('Marmelade','Stk',[['Marille 215 g',5],['Marille 360 g',8.5],['Zwetschgen 215 g',5],['Erdbeer 230 g',5.5],['Dreifrucht 215 g',6],['Kirsche 215 g',6],['Preiselbeere 230 g',6.5],['Himbeere 215 g',6]]);
 add('Gelee','Stk',[['Quittengelee',5.5],['Johannisbeergelee',5.5],['Holunderblütengelee',6.5],['Holunderbeerengelee',6.5],['Schlehdorngelee',6.5]]);
 add('Honig','Stk',[['Alpenrosenhonig 250 g',6.5],['Alpenrosenhonig 400 g',10]]);
 add('Apfelsaft','Stk',[['Apfelsaft 1,5 l',4.5],['Apfelsaft 3 l',8.5]]);
 const sy=[];['Marille','Quitte','Holunder','Palabirne','Zitronenmelisse'].forEach(f=>{sy.push(['Sirup '+f+' 500 ml',8.5]);sy.push(['Sirup '+f+' 250 ml',5])});sy.push(['Sirup Johannisbeere 250 ml',5]);
 add('Sirup','Stk',sy);
 return{tasks:[],events:[],products:fixProd(P),customers:[],orders:[],ocats:['Frischfleisch','Pakete','Hofladen (Abholung)'],...extSeed(),...newSeed()};
}
function emptyDb(){return{tasks:[],events:[],products:[],customers:[],orders:[],ocats:['Frischfleisch','Pakete','Hofladen (Abholung)'],settings:{invImg:true},prices:[],ext:[],kvs:[],recipes:[],mix:[],pf:[],pm:[]}}
let db=emptyDb(),view='home',ui={d:newDraft(),f:{},of:'open'},me=null;
const isAdmin=()=>!!me&&me.role==='admin';
const can=k=>isAdmin()||!!(me&&me.perms&&me.perms[k]);
const VP={tasks:['tasks','ext'],cal:['cal'],orders:['orders'],products:['products'],customers:['customers'],inv:['inv'],ext:['ext'],rec:['recipes'],mix:['mix'],prod:['prod'],settings:'admin',users:'admin'};
function okView(v){const p=VP[v];if(p==='admin')return isAdmin();return !p||p.some(k=>can(k))}
const DEFP={tasks:1,cal:1,orders:1,products:1,prices:0,customers:1,ext:1,recipes:1,mix:1,prod:1,inv:0};
const PERM_L=[['tasks','Arbeiten (Hof und Betrieb)',''],['cal','Kalender',''],['orders','Bestellungen',''],['products','Produkte','Verfügbarkeit ändern, Produkte anlegen'],['prices','Preise ändern','Produktpreise und Preisliste für Dritte'],['customers','Kunden',''],['ext','Arbeiten für Dritte','eintragen, Preise nur ansehen'],['recipes','Rezepte',''],['mix','Mischpakete',''],['prod','Produktionslisten',''],['inv','Rechnungen','mit Kostenvoranschlägen und Kundenpreisen']];
const ASECS=['tasks','events','products','customers','orders','ext','kvs','prices','recipes','pf','pm'];
const MIXORD=['Rind','Hirsch','Reh','Truthahn','Schwein'];
let synced=new Map(),seq=0,dirty=false,syncing=false,again=false,syncT=null,pendingR=false,stat='ok';
async function api(path,body,method){
 const r=await fetch(path,{method:method||(body===undefined?'GET':'POST'),headers:body===undefined?{}:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),credentials:'same-origin'});
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error(j.error||'Fehler ('+r.status+')');e.status=r.status;throw e}
 return j;
}
function snap(){const m=new Map();ASECS.forEach(k=>db[k].forEach(x=>m.set(k+'/'+x.id,JSON.stringify(x))));db.mix.forEach(x=>m.set('mix/'+x.name,JSON.stringify(x)));m.set('meta/ocats',JSON.stringify({list:db.ocats}));m.set('meta/settings',JSON.stringify(db.settings));return m}
function setStat(x){stat=x;const e=$('#stat');if(e)e.textContent=x==='ok'?'✓ Alles gespeichert':x==='sync'?'… Speichert':'⚠ Keine Verbindung, wird nachgeholt'}
function save(){dirty=true;clearTimeout(syncT);syncT=setTimeout(sync,250);setStat('sync')}
async function sync(){
 if(syncing){again=true;return}syncing=true;
 try{
  do{again=false;const cur=snap(),ops=[];
   cur.forEach((v,k)=>{if(synced.get(k)!==v){const i=k.indexOf('/');ops.push({op:'put',sec:k.slice(0,i),id:k.slice(i+1),data:JSON.parse(v)})}});
   synced.forEach((v,k)=>{if(!cur.has(k)){const i=k.indexOf('/');ops.push({op:'del',sec:k.slice(0,i),id:k.slice(i+1)})}});
   for(let i=0;i<ops.length;i+=100)await api('/api/sync',{ops:ops.slice(i,i+100)});
   ops.forEach(o=>{const k=o.sec+'/'+o.id;if(o.op==='put')synced.set(k,cur.get(k));else synced.delete(k)});
  }while(again);
  dirty=false;setStat('ok');
 }catch(e){
  if(e.status===401){location.reload();return}
  if(e.status===403||e.status===413){syncing=false;dirty=false;alert(e.message);await loadAll();R();return}
  setStat('off');setTimeout(sync,5000);
 }finally{syncing=false}
}
function applyItems(items){
 let ch=0;
 items.forEach(r=>{const k=r.sec+'/'+r.id;
  if(r.del){
   if(ASECS.includes(r.sec)){const n=db[r.sec].length;db[r.sec]=db[r.sec].filter(x=>x.id!==r.id);if(db[r.sec].length!==n)ch++}
   else if(r.sec==='mix'){const n=db.mix.length;db.mix=db.mix.filter(x=>x.name!==r.id);if(db.mix.length!==n)ch++}
   synced.delete(k);return;
  }
  let o;try{o=JSON.parse(r.data)}catch(e){return}
  const t=JSON.stringify(o);if(synced.get(k)===t)return;
  if(ASECS.includes(r.sec)){const i=db[r.sec].findIndex(x=>x.id===r.id);if(i<0)db[r.sec].push(o);else db[r.sec][i]=o}
  else if(r.sec==='mix'){const i=db.mix.findIndex(x=>x.name===r.id);if(i<0)db.mix.push(o);else db.mix[i]=o}
  else if(r.sec==='meta'&&r.id==='ocats')db.ocats=o.list;
  else if(r.sec==='meta'&&r.id==='settings')db.settings=Object.assign({invImg:true},o);
  synced.set(k,t);ch++;
 });
 return ch;
}
function sortAll(){
 ASECS.forEach(k=>db[k].sort((a,b)=>a.id<b.id?-1:1));
 db.orders.reverse();
 db.mix.sort((a,b)=>(MIXORD.indexOf(a.name)+1||99)-(MIXORD.indexOf(b.name)+1||99));
 fixProd(db.products);
}
async function loadAll(){
 const r=await api('/api/data?since=0');
 db=emptyDb();synced=new Map();applyItems(r.items);seq=r.now;
 if(!r.items.length&&isAdmin())db=Object.assign(emptyDb(),seed());
 else if(!db.mix.length&&can('mix'))db.mix=mixData();
 sortAll();
 if(snap().size!==synced.size)save();
}
function busy(){
 const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return true;
 return [...document.querySelectorAll('#main input:not([type=checkbox]):not([type=radio]):not([type=file]),#main textarea')].some(e=>e.value!==e.defaultValue);
}
async function poll(){
 if(!me)return;
 if(pendingR&&!busy()){pendingR=false;R()}
 if(syncing||dirty)return;
 try{
  const r=await api('/api/data?since='+Math.max(0,seq-5000));
  if(syncing||dirty)return;
  if(r.perms&&(r.role!==me.role||JSON.stringify(r.perms)!==JSON.stringify(me.perms))){location.reload();return}
  const n=applyItems(r.items);seq=r.now;
  if(n){sortAll();if(busy())pendingR=true;else R()}
  if(stat!=='ok')setStat('ok');
 }catch(e){if(e.status===401)location.reload();else setStat('off')}
}
async function startApp(){
 document.body.classList.remove('login');
 await loadAll();
 setInterval(poll,15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
 window.onbeforeunload=e=>{if(dirty||syncing){e.preventDefault();e.returnValue=''}};
 R();
}
function loginHtml(msg){return `<div class="lg"><img class="lgi" src="/logo.png" alt="Hof am Schloss"><h1>Hofplaner</h1><form onsubmit="return doLogin(this)" class="box"><label class="fl">Benutzername<input name="u" autocomplete="username" autocapitalize="none" autocorrect="off" required></label><label class="fl" style="margin-top:.7rem">Passwort<input type="password" name="p" autocomplete="current-password" required></label>${msg?`<p class="err" role="alert">${esc(msg)}</p>`:''}<div class="row"><button>Anmelden</button></div></form></div>`}
function setupHtml(st,msg){return `<div class="lg"><img class="lgi" src="/logo.png" alt="Hof am Schloss"><h1>Hofplaner einrichten</h1>${st.setupConfigured?'':'<div class="box"><p class="err">Es fehlt noch ein Einrichtungscode.</p><p>In Cloudflare beim Projekt unter <strong>Einstellungen</strong>, <strong>Variablen und Geheimnisse</strong> ein Geheimnis (Secret) mit dem Namen <strong>SETUP_CODE</strong> anlegen und einen beliebigen Code als Wert eintragen. Danach diese Seite neu laden.</p></div>'}<form onsubmit="return doSetup(this)" class="box"><p>Lege den ersten Admin an.</p><label class="fl">Einrichtungscode<input name="c" autocomplete="off" required></label><label class="fl" style="margin-top:.7rem">Benutzername<input name="u" autocomplete="username" autocapitalize="none" required></label><label class="fl" style="margin-top:.7rem">Passwort (mindestens 8 Zeichen)<input type="password" name="p" autocomplete="new-password" required></label><label class="fl" style="margin-top:.7rem">Passwort wiederholen<input type="password" name="p2" autocomplete="new-password" required></label>${msg?`<p class="err" role="alert">${esc(msg)}</p>`:''}<div class="row"><button>Admin anlegen</button></div></form></div>`}
async function showLogin(msg){
 document.body.classList.add('login');
 let st={needsSetup:false,setupConfigured:true};try{st=await api('/api/status')}catch(e){}
 $('#main').innerHTML=st.needsSetup?setupHtml(st,msg):loginHtml(msg);
}
function doLogin(f){api('/api/login',{username:f.u.value,password:f.p.value}).then(r=>{me=r.user;return startApp()}).catch(e=>showLogin(e.message));return false}
function doSetup(f){
 if(f.p.value!==f.p2.value){showLogin('Die Passwörter stimmen nicht überein.');return false}

const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const p2=n=>String(n).padStart(2,'0');
function calItems(date){
 const a=db.events.filter(e=>e.date===date).map(e=>({k:'e',id:e.id,title:e.title,time:e.time,date,done:e.done}));
 db.tasks.forEach(t=>{if(occursOn(t,date))a.push({k:'t',id:t.id,title:t.text,time:'',date,done:!t.rep&&t.done,rep:t.rep})});
 db.ext.forEach(e=>e.jobs.forEach(j=>{if(j.date===date)a.push({k:'j',id:j.id,title:cn(e)+': '+j.what,time:'',date,done:false})}));
 db.orders.forEach(o=>{if(o.due===date)a.push({k:'o',id:o.id,title:o.name+' ('+o.cat+')',time:'',date,done:!!o.done})});
 return a.sort((x,y)=>(x.time||'').localeCompare(y.time||''));
}
function calGo(d){const [y,m]=(ui.cm||today().slice(0,7)).split('-').map(Number);ui.cm=d===0?today().slice(0,7):(()=>{const t=new Date(y,m-1+d,1);return t.getFullYear()+'-'+p2(t.getMonth()+1)})();R()}

function calGrid(){
 const cm=ui.cm||today().slice(0,7),[y,m]=cm.split('-').map(Number),off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate(),n=Math.ceil((off+dim)/7)*7,t=today();
 let h=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('');
 for(let i=0;i<n;i++){
  const d=i-off+1;if(d<1||d>dim){h+='<div class="cd leer"></div>';continue}
  const date=cm+'-'+p2(d),ev=calItems(date);
  h+=`<button class="cd ${date===t?'heute':''} ${date===ui.sel?'sel':''}" onclick="calPick('${date}')" aria-label="${d}. ${MN[m-1]}, ${ev.length} Termine"><b>${d}</b>`+ev.slice(0,3).map(e=>`<span class="ce ${e.k==='t'?'ar':e.k==='j'?'jb':e.k==='o'?'od':''} ${e.done?'done':''}">${e.time?esc(e.time)+' ':''}${esc(e.title)}</span>`).join('')+(ev.length>3?`<span class="cm">+${ev.length-3} weitere</span>`:'')+`</button>`;
 }
 return `<div class="calnav"><button class="ghost" onclick="calGo(-1)" aria-label="Vorheriger Monat">‹</button><h2>${MN[m-1]} ${y}</h2><button class="ghost" onclick="calGo(1)" aria-label="Nächster Monat">›</button><button class="ghost" onclick="calGo(0)">Heute</button></div><div class="cg">${h}</div>`;
}

   'Mit „Verschieben nach …“ hängst du eine Arbeit an einen anderen Kunden. Arbeiten erscheinen blau im Kalender.',
   can('prices')?'Die Preisliste (Grundpreise) kannst du ändern und mit „+ Leistung hinzufügen“ ergänzen.':'Die Preisliste siehst du nur an. Ändern darf sie, wer das Recht „Preise ändern“ hat.',
   can('inv')?'<strong>Preise dieses Kunden</strong> ändern, gilt nur für diesen Kunden und wird zur Sicherheit doppelt bestätigt.':'',
   can('inv')?'Mehrere Arbeiten fasst du mit den Häkchen und <strong>Ausgewählte aufnehmen</strong> zu einem <strong>Kostenvoranschlag</strong> zusammen. Nach „Bestätigen“ ist er fest, du kannst ihn als PDF speichern. Jede Arbeit erscheint außerdem einzeln unter Rechnungen.':'Abgerechnet wird später von jemandem mit dem Recht „Rechnungen“. Sobald eine Arbeit verrechnet ist, siehst du sie hier nicht mehr.'
  ]);
  sec(['inv'],'Rechnungen',[
   'Jede Rechnung durchläuft drei Stufen: <strong>Noch zu schreiben</strong> → mit „Rechnung geschrieben“ → <strong>Noch zu kassieren</strong> → mit „Als bezahlt markieren“ → <strong>Bezahlt</strong>. Mit den anderen Knöpfen gehst du einen Schritt zurück.',
   'Hier landen erledigte Bestellungen und alle Arbeiten für Dritte (oder deren Kostenvoranschläge).',
   '<strong>Als PDF speichern</strong> öffnet den Druckdialog. Dort wählst du als Drucker „Als PDF speichern“.',
   'Auf der Startseite zählen zwei Kästchen, wie viele Rechnungen noch zu schreiben und zu kassieren sind.'
  ]);
  sec(['recipes'],'Rezepte',[
   'Oben legst du ein neues Rezept an: Gruppe wählen (zum Beispiel Salami, Speck oder Marmeladen), Name, Zutaten (eine pro Zeile) und Zubereitung eintragen, speichern.',
   'Darunter stehen alle Rezepte nach Gruppen. Tippe ein Rezept an, um es zu lesen, zu bearbeiten oder zu löschen.'
  ]);
  sec(['mix'],'Mischpakete',[
   'Für jede Fleischsorte (Rind, Hirsch, Reh, Truthahn, Schwein) gibt es eine Tabelle: Wie viel kg von welchem Fleischteil kommen in welche Paketgröße. Zahlen ändern sich direkt, die Summe rechnet mit.',
   'Mit <strong>+ Größe</strong> und <strong>+ Fleischteil</strong> erweiterst du die Tabelle.',
   can('prices')?'Die Spalte <strong>Preis €</strong> ist der Preis pro Paket. Pakete mit Preis kann man unter Bestellungen auswählen.':'Die Spalte „Preis €“ ist der Preis pro Paket. Ändern darf ihn, wer das Recht „Preise ändern“ hat.'
  ]);
  sec(['prod'],'Produktionslisten',[
   '<strong>Fleisch</strong>: „+ Neuer Eintrag“, Datum, was hergestellt wurde, Menge in kg und die Daten der Rohware (Rind-, Wild-, Magerfleisch, Wurstspeck) eintragen. Die Lotto-Nummer vergibt die App selbst. Darunter siehst du die Summen je Produkt.',
   '<strong>Marmeladen</strong>: Datum, was, Menge Frucht, Rest vom Vorjahr und die Stückzahl je Glasgröße eintragen. Auch hier wird die Lotto-Nummer automatisch vergeben und es gibt eine Übersicht.',
   'Mit × löschst du einen Eintrag.'
  ]);
  sec(adm,'Einstellungen (nur Admin)',[
   '<strong>Benutzer</strong>: neue Benutzer anlegen (Passwort mindestens 8 Zeichen), Namen ändern, Passwort neu setzen, Rolle wechseln oder löschen. Es muss immer mindestens einen Admin geben.',
   '<strong>Rechte</strong>: Für jeden Benutzer legst du mit Haken fest, was er sehen und tun darf. Änderungen gelten sofort. „Auf Standard setzen“ stellt die Grundeinstellung wieder her: alles außer „Preise ändern“ und „Rechnungen“. Admins dürfen immer alles.',
   '<strong>Export</strong>: Daten als Excel-Datei oder PDF herunterladen.',
   '<strong>Löschen</strong>: Rechnungen, Bestellungen, erledigte Arbeiten und vergangene Termine endgültig löschen. Rechnungsnummern werden danach wieder vergeben.'
  ]);
  const mine=adm?'Du bist <strong>Admin</strong> und darfst alles.':'Du darfst: '+PERM_L.filter(p=>can(p[0])).map(p=>p[1]).join(', ')+'.';
  return `<h1>Hilfe</h1><div class="box"><p style="margin-top:0">Angemeldet als <strong>${esc(me.username)}</strong>. ${mine}</p><p style="margin-bottom:0"><small>Hier steht nur, was du in der App auch tatsächlich siehst. Fehlt dir ein Menüpunkt, den du brauchst, frag den Admin.</small></p></div>`+H.map(([t,a],i)=>det('h'+i,esc(t),L(a))).join('');
 },
 users(){ui.st='users';return V.settings()},
 settings(){
  const st=ui.st||'users',T=[['users','Benutzer'],['rights','Rechte'],['export','Export'],['clean','Löschen']];
  return `<h1>Einstellungen</h1><div class="row">${T.map(([k,l])=>`<button class="${st===k?'':'ghost'}" onclick="ui.st='${k}';go('settings')">${l}</button>`).join('')}</div>`+(st==='rights'?V.rightsBody():st==='export'?V.exportBody():st==='clean'?V.cleanBody():V.usersBody());
 },
 rightsBody(){
  if(!ui.users){loadUsers();return '<p class="empty">Lade …</p>'}
  const us=ui.users.filter(u=>u.role!=='admin');
  return `<p><small>Admins dürfen immer alles. Hier legst du fest, was jeder Benutzer sehen und tun darf. Änderungen gelten sofort, die App des Benutzers lädt sich dabei von selbst neu.</small></p>`+(us.length?us.map(u=>`<div class="box"><div class="row"><strong>${esc(u.username)}</strong><span style="flex:1"></span><button class="ghost" onclick="permReset(${u.id})">Auf Standard setzen</button></div><div class="pg">${PERM_L.map(([k,l,h])=>`<label class="pk"><input type="checkbox" ${u.perms[k]?'checked':''} onchange="setPerm(${u.id},'${k}',this.checked)"> ${l}${h?`<small>${h}</small>`:''}</label>`).join('')}</div></div>`).join(''):'<p class="empty">Noch keine Benutzer. Lege sie unter „Benutzer“ an.</p>');
 },
 exportBody(){
  const E=expSets(),sel=ui.ex||(ui.ex=Object.fromEntries(E.map(e=>[e.id,true])));
  return `<p><small>Wähle aus, was exportiert werden soll. Excel erzeugt eine Datei mit einem Blatt pro Auswahl. Bei PDF öffnet sich der Druckdialog, dort „Als PDF speichern“ wählen.</small></p><div class="box"><div class="pg">${E.map(e=>`<label class="pk"><input type="checkbox" ${sel[e.id]?'checked':''} onchange="ui.ex['${e.id}']=this.checked"> ${esc(e.name)}<small>${e.rows.length} Zeilen</small></label>`).join('')}</div><div class="row"><button onclick="expXlsx()">Excel (.xlsx) herunterladen</button><button class="ghost" onclick="expPdf()">PDF erstellen</button><button class="ghost" onclick="expAll(true)">Alles auswählen</button><button class="ghost" onclick="expAll(false)">Nichts auswählen</button></div></div><h2>Produktkatalog</h2><div class="box"><p style="margin-top:0"><small>Preisliste mit Fotos, nach Kategorien geordnet. Du kannst sie am Hofladen aushängen oder Kunden schicken. Ausgeblendete Produkte fehlen immer.</small></p><div class="row"><label class="pk"><input type="checkbox" id="cat_na"> auch derzeit nicht verfügbare Produkte</label><label class="pk"><input type="checkbox" id="cat_mix" checked> Mischpakete mit Preis</label></div><div class="row"><button onclick="expCatalog()">Produktkatalog als PDF</button></div></div>`;
 },
 cleanBody(){
  const X=extInv(),rows=[...db.orders.filter(o=>o.done&&o.rno).map(o=>`<div class="box"><div class="row"><strong>${esc(o.rno)}</strong><small>${fmtD(o.date)}</small><span>${esc(o.name)}</span><span style="flex:1"></span><strong>${nf(sum(o.items))} €</strong></div><div class="row"><button class="ghost" onclick="revertInv('${o.id}')">Rechnung zurücknehmen</button><button class="ghost" onclick="killOrder('${o.id}')">Rechnung und Bestellung löschen</button></div></div>`),...X.map(x=>`<div class="box"><div class="row"><strong>${esc(x.no||'Arbeit')}</strong><small>${fmtD(x.date)}</small><span>${esc(cn(x.e))}</span><span class="tag">Arbeiten für Dritte</span><span style="flex:1"></span><strong>${nf(x.tot)} €</strong></div><small>${esc(x.what)}</small><div class="row"><button class="ghost" onclick="killX('${x.kind}','${x.id}')">Löschen</button></div></div>`)];
  const oo=db.orders.filter(o=>!o.done),nt=db.tasks.filter(t=>t.done&&!t.rep).length,ne=db.events.filter(e=>e.date<today()).length;
  return `<p><small>Hier löschst du Rechnungen und anderes endgültig. Das lässt sich nicht rückgängig machen. Die Rechnungsnummer wird bei der nächsten Rechnung wieder vergeben (ebenso die Nummer eines Kostenvoranschlags).</small></p><h2>Rechnungen</h2>${rows.length?rows.join(''):'<p class="empty">Keine Rechnungen.</p>'}<h2>Offene Bestellungen</h2>${oo.length?oo.map(o=>`<div class="box"><div class="row"><strong>${esc(o.name)}</strong><small>${esc(o.cat)}, ${fmtD(o.date)}</small><span style="flex:1"></span><strong>${nf(sum(o.items))} €</strong><button class="ghost" onclick="killOrder('${o.id}')">Löschen</button></div></div>`).join(''):'<p class="empty">Keine offenen Bestellungen.</p>'}<h2>Aufräumen</h2><div class="row"><button class="ghost" onclick="cleanTasks()" ${nt?'':'disabled'}>Erledigte Arbeiten löschen (${nt})</button><button class="ghost" onclick="cleanEvents()" ${ne?'':'disabled'}>Vergangene Termine löschen (${ne})</button></div>`;
 },
 usersBody(){
  if(!ui.users){loadUsers();return '<p class="empty">Lade …</p>'}
  const rows=ui.users.map(u=>`<div class="box"><div class="row"><strong>${esc(u.username)}</strong>${u.id===me.id?'<span class="tag">du</span>':''}<span style="flex:1"></span><select onchange="setRole(${u.id},this.value)" aria-label="Rolle von ${esc(u.username)}" ${u.id===me.id?'disabled':''}><option value="user" ${u.role==='user'?'selected':''}>Benutzer</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select>${u.id===me.id?'':`<button class="x" onclick="delUser(${u.id})" aria-label="${esc(u.username)} löschen">×</button>`}</div><div class="row"><input id="un_${u.id}" value="${esc(u.username)}" autocapitalize="none" aria-label="Benutzername von ${esc(u.username)}"><button class="ghost" onclick="renameUser(${u.id})">Namen ändern</button></div><div class="row"><input type="password" id="up_${u.id}" placeholder="Neues Passwort" autocomplete="new-password" aria-label="Neues Passwort für ${esc(u.username)}"><button class="ghost" onclick="setUPw(${u.id})">Passwort setzen</button></div></div>`).join('');
  return `<p><small>Admins sehen und ändern alles. Was ein Benutzer darf, stellst du unter „Rechte“ ein. Neue Benutzer starten mit den Standardrechten: alles außer Preise ändern und Rechnungen.</small></p>${tb('u','+ Neuer Benutzer')}${ui.f.u?`<form onsubmit="return addUser(this)" class="box"><div class="row"><input name="n" placeholder="Benutzername" autocapitalize="none" required><input type="password" name="p" placeholder="Passwort (min. 8 Zeichen)" autocomplete="new-password" required><select name="r"><option value="user">Benutzer</option><option value="admin">Admin</option></select><button>Anlegen</button></div></form>`:''}${rows}`;
 },
 acct(){
  return `<h1>Mein Konto</h1><p>Angemeldet als <strong>${esc(me.username)}</strong> (${isAdmin()?'Admin':'Benutzer'}).</p><h2>Passwort ändern</h2><form onsubmit="return changePw(this)" class="box"><div class="row"><input type="password" name="o" placeholder="Altes Passwort" autocomplete="current-password" required><input type="password" name="n" placeholder="Neues Passwort (min. 8 Zeichen)" autocomplete="new-password" required><input type="password" name="n2" placeholder="Neues Passwort wiederholen" autocomplete="new-password" required><button>Passwort ändern</button></div></form><p><button class="ghost" onclick="logout()">Abmelden</button></p>`;
 },
 customers(){
  return `<h1>Kunden</h1>${tb('c','+ Neuer Kunde')}${ui.f.c?`<form onsubmit="return addCust(this)"><div class="row"><input name="name" placeholder="Name" required><input name="email" placeholder="E-Mail"><input name="tel" placeholder="Telefon"><input name="adr" placeholder="Adresse"></div><div class="row"><input name="note" placeholder="Notiz" style="flex:1"><button>Kunde anlegen</button></div></form>`:''}`+
  (db.customers.length?db.customers.map(c=>`<div class="box"><div class="row"><input value="${esc(c.name)}" onchange="upC('${c.id}','name',this.value)" aria-label="Name"><input value="${esc(c.email)}" placeholder="E-Mail" onchange="upC('${c.id}','email',this.value)"><input value="${esc(c.tel)}" placeholder="Telefon" onchange="upC('${c.id}','tel',this.value)"><input value="${esc(c.adr)}" placeholder="Adresse" onchange="upC('${c.id}','adr',this.value)"><span style="flex:1"></span><button class="x" onclick="del('c','${c.id}')" aria-label="löschen">×</button></div><input value="${esc(c.note)}" placeholder="Notiz" style="width:100%" onchange="upC('${c.id}','note',this.value)"></div>`).join(''):'<p class="empty">Noch keine Kunden.</p>');
 }
};
const NAVG=[
 {g:'',items:[['home','Start']]},
 {g:'Tagesgeschäft',items:[['tasks','Arbeiten'],['cal','Kalender']]},
 {g:'Verkauf',items:[['orders','Bestellungen'],['products','Produkte'],['customers','Kunden'],['inv','Rechnungen']]},
 {g:'Hof',items:[['rec','Rezepte'],['mix','Mischpakete'],['prod','Produktionslisten']]},
 {g:'',items:[['help','Hilfe'],['settings','Einstellungen']]}
];
const NAV=NAVG.flatMap(g=>g.items);
const BAR=[['home','Start'],['tasks','Arbeiten'],['cal','Kalender'],['orders','Bestellungen']];
function go(v){if(!okView(v))v='home';view=v;ui.more=false;if(v==='users'||v==='settings')ui.users=null;R();scrollTo(0,0)}
function toggleMore(){ui.more=!ui.more;R()}
function R(){
 const adm=isAdmin();if(!okView(view))view='home';
 $('#nav').innerHTML=`<div class="logo"><img src="/logo.png" alt="Hof am Schloss"><span>Hofplaner</span></div>`+NAVG.filter(g=>g.items.some(i=>okView(i[0]))).map(g=>(g.g?`<div class="gh">${g.g}</div>`:'')+g.items.filter(i=>okView(i[0])).map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${l}</button>`).join('')).join('')+`<div class="nf"><div id="stat" class="stat"></div><button class="${view==='acct'?'on':''}" onclick="go('acct')">${esc(me.username)} (${adm?'Admin':'Benutzer'})</button><button onclick="logout()">Abmelden</button></div>`;
 $('#bar').innerHTML=BAR.filter(b=>okView(b[0])).map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+`<button class="${ui.more?'on':''}" onclick="toggleMore()">Mehr</button>`;
 document.body.classList.toggle('more',!!ui.more);
 $('#main').innerHTML=V[view]();if(view==='orders')prodImg();setStat(stat);
}
window.onafterprint=()=>{document.title='Hofplaner'};
boot();
</script>
</body>
