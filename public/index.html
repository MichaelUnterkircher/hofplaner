<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hofplaner</title>
<style>
:root{--ink:#1f2a24;--bg:#f4f5ef;--card:#fff;--line:#d8dccf;--green:#2d5a3d;--red:#b3261e;--muted:#667068;box-sizing:border-box}
*{box-sizing:inherit}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:210px 1fr;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
h1,h2,.logo{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:700}
h1{font-size:2rem;margin:.2em 0 .6em}h2{font-size:1.25rem;margin:1.4em 0 .5em}
nav{background:var(--green);color:#fff;padding:1.2rem .8rem;position:sticky;top:0;height:100vh}
.logo{font-size:1.5rem;padding:0 .6rem 1rem}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#dfe9e1;font:inherit;padding:.6rem .7rem;border-radius:6px;cursor:pointer}
nav button.on{background:#fff;color:var(--green);font-weight:600}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e0a800;outline-offset:1px}
main{padding:1.5rem 2rem 4rem;max-width:900px;width:100%}
button,.btn{font:inherit;padding:.45rem .9rem;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:6px;cursor:pointer}
button.ghost{background:none;color:var(--green)}
button.x{background:none;border:0;color:var(--muted);font-size:1.3rem;padding:0 .4rem}
input,select{font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 1rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.3rem 0}
ul.tl{list-style:none;padding:0;margin:0}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:.6rem;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin-bottom:.4rem}
.task.ev{border-left-color:var(--red)}.task.ev span{color:var(--red);font-weight:600}
.task.done{opacity:.45}.task.done span{text-decoration:line-through}
.task input[type=checkbox]{width:1.3rem;height:1.3rem}
small{display:block;color:var(--muted)}
table{border-collapse:collapse;width:100%}td,th{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.dim{opacity:.45}.pr{width:5.5rem;text-align:right}.av label{display:inline-block;margin-right:.6rem;font-size:.85rem}
.sum{font-weight:700;font-size:1.1rem}
.done-o{opacity:.5}
.empty{color:var(--muted);padding:.5rem 0}
@media(max-width:760px){
 body{grid-template-columns:1fr;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
 nav{position:fixed;inset:auto 0 0 0;height:auto;display:flex;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));z-index:5}
 .logo{display:none}nav button{text-align:center;padding:.5rem .1rem;font-size:.72rem;flex:1}
 main{padding:1rem 1rem 2rem}.task{grid-template-columns:auto 1fr auto}.task select{display:none}
}
h3{font-size:1rem;margin:1rem 0 .3rem}details{margin:.4rem 0}summary{cursor:pointer;font-weight:600;padding:.3rem 0}details.sub{margin-left:1rem}
.job{border-top:1px solid var(--line);padding:.5rem 0}.job.inkv{background:#fff6dd}
.tag{font-size:.75rem;background:#fff6dd;border:1px solid #e0c36a;border-radius:99px;padding:.05rem .5rem}
.pr.ind{background:#fff6dd;border-color:#c99a00;font-weight:700}
.calnav{display:flex;align-items:center;gap:.5rem;margin:.6rem 0}.calnav h2{margin:0;flex:1;text-align:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:1rem}
.cg .wd{font-size:.8rem;color:var(--muted);text-align:center;padding:.2rem 0;font-weight:600}
.cd{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:5.6rem;padding:.25rem;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-align:left;font:inherit;cursor:pointer;overflow:hidden;min-width:0}
.cd.leer{background:transparent;border-color:transparent;cursor:default}
.cd.heute{border:2px solid var(--green)}.cd.sel{background:#eef3ea;outline:2px solid #e0a800}
.cd b{font-size:.85rem}.cd.heute b{color:var(--green)}
.ce{font-size:.72rem;background:#fbe3e1;color:var(--red);border-radius:4px;padding:0 .25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce.done{opacity:.45;text-decoration:line-through}
.cm{font-size:.72rem;color:var(--muted)}
@media(max-width:760px){.cd{min-height:3.6rem}.ce{font-size:0;height:.45rem;padding:0;border-radius:99px;background:var(--red)}.ce.done{background:#d9a6a2}.cm{display:none}}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}body{display:block;background:#fff}}
</style>
</head>
<body>
<nav id="nav" aria-label="Hauptmenü"></nav>
<main id="main"></main>
<div id="pr"></div>
<script>
const K='hofplaner-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const days=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const fmtD=d=>d.split('-').reverse().join('.');
const nf=x=>Number(x).toLocaleString('de-DE',{maximumFractionDigits:2,minimumFractionDigits:2});
const num=s=>parseFloat(String(s).replace(',','.'));
const PL={1:'Hohe Priorität',2:'Mittlere Priorität',3:'Niedrige Priorität'};

function seed(){
 const P=[];const add=(cat,unit,list)=>list.forEach(([n,p])=>P.push({id:uid(),cat,name:n,price:p,unit,avail:'ja',changed:null}));
 add('Speck','kg',[['Bauchspeck',32],['Schlegelspeck',34],['Speck vom Kaiserteil',null],['Karreespeck',null],['Schulterspeck',null],['Nackenspeck',null],['Seitenspeck',null]]);
 add('Kaminwurz','Stk',[['Rindkaminwurz 120 g (2/3 Rind)',2.1],['Hirschkaminwurz 120 g',2.6],['Wildschwein 120 g',2.6],['Frische Hauswurst 120 g',2],['Grillwürstchen 60 g',1.2],['Geräucherte Hauswurst 120 g',2]]);
 add('Salami','kg',[['Bauernsalami (2/3 Rind)',35.5],['Hirschsalami',43],['Schweinesalami',34],['Wildschweinsalami',39.5]]);
 add('Geräuchertes','kg',[['Geräuchertes Rindfleisch',43.5],['Geräuchertes Hirschfleisch',59.5],['Geräuchertes Schweinefilet',50.5]]);
 add('Käse','kg',[['Alm-Käse',24.5],['Alm-Butter',22]]);
 add('Frischfleisch','kg',[['Rindfleisch',null],['Hirschfleisch',null],['Schweinefleisch',null]]);
 add('Frischfleisch','Stk',[['Kalbsragù 350 g',8.9]]);
 add('Marmelade','Stk',[['Marille 215 g',5],['Marille 360 g',8.5],['Zwetschgen 215 g',5],['Erdbeer 230 g',5.5],['Dreifrucht 215 g',6],['Kirsche 215 g',6],['Preiselbeere 230 g',6.5],['Himbeere 215 g',6]]);
 add('Gelee','Stk',[['Quittengelee',5.5],['Johannisbeergelee',5.5],['Holunderblütengelee',6.5],['Holunderbeerengelee',6.5],['Schlehdorngelee',6.5]]);
 add('Honig','Stk',[['Alpenrosenhonig 250 g',6.5],['Alpenrosenhonig 400 g',10]]);
 add('Apfelsaft','Stk',[['Apfelsaft 1,5 l',4.5],['Apfelsaft 3 l',8.5]]);
 const sy=[];['Marille','Quitte','Holunder','Palabirne','Zitronenmelisse'].forEach(f=>{sy.push(['Sirup '+f+' 500 ml',8.5]);sy.push(['Sirup '+f+' 250 ml',5])});sy.push(['Sirup Johannisbeere 250 ml',5]);
 add('Sirup','Stk',sy);
 return{tasks:[],events:[],products:P,customers:[],orders:[],ocats:['Frischfleisch','Pakete','Hofladen (Abholung)'],...extSeed()};
}
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.products)return Object.assign(extSeed(),d)}catch(e){}return seed()}
let db=load(),view='home',ui={d:newDraft(),openForm:false};
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
function newDraft(){return{items:[],cat:'Frischfleisch',name:'',email:'',tel:'',adr:'',l:'',b:'',h:'',w:'',fertig:false}}

/* ---------- Arbeiten (inkl. Kalender, Pakete) ---------- */
function allTasks(){
 const a=db.tasks.map(t=>({k:'t',id:t.id,text:t.text,p:t.p,done:t.done}));
 db.events.forEach(e=>{const d=days(e.date);a.push({k:'e',id:e.id,text:e.title+(e.time?', '+e.time+' Uhr':''),date:e.date,p:d<=2?1:d<=14?2:3,done:e.done})});
 db.orders.forEach(o=>{if(o.cat==='Pakete'&&o.l&&o.b&&o.h&&o.w&&o.fertig&&!o.done)a.push({k:'s',id:o.id,text:'Paket versenden: '+o.name,p:1,done:!!o.shipped,note:o.l+'×'+o.b+'×'+o.h+' cm, '+o.w+' kg'})});
 return a;
}
function row(t){
 return `<li class="task ${t.done?'done':''} ${t.k==='e'?'ev':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tog('${t.k}','${t.id}')" aria-label="erledigt"><div><span>${esc(t.text)}</span>${t.date?`<small>Termin am ${fmtD(t.date)}</small>`:''}${t.note?`<small>${esc(t.note)}</small>`:''}</div>`+
 (t.k==='t'?`<select onchange="setP('${t.id}',this.value)" aria-label="Priorität">${[1,2,3].map(p=>`<option value="${p}" ${t.p==p?'selected':''}>${PL[p]}</option>`).join('')}</select><button class="x" onclick="del('t','${t.id}')" aria-label="löschen">×</button>`:'')+`</li>`;
}
function tog(k,id){
 if(k==='t'){const t=db.tasks.find(x=>x.id===id);t.done=!t.done}
 if(k==='e'){const e=db.events.find(x=>x.id===id);e.done=!e.done}
 if(k==='s'){const o=db.orders.find(x=>x.id===id);o.shipped=!o.shipped}
 save();R();
}
function setP(id,p){db.tasks.find(x=>x.id===id).p=+p;save();R()}
function del(k,id){
 if(!confirm('Wirklich löschen?'))return;
 const m={t:'tasks',e:'events',c:'customers',o:'orders'}[k];db[m]=db[m].filter(x=>x.id!==id);save();R();
}
function addTask(f){const t=f.text.value.trim();if(!t)return false;db.tasks.push({id:uid(),text:t,p:+f.p.value,done:false});save();R();return false}

/* ---------- Kalender ---------- */
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const p2=n=>String(n).padStart(2,'0');
function calGo(d){const [y,m]=(ui.cm||today().slice(0,7)).split('-').map(Number);ui.cm=d===0?today().slice(0,7):(()=>{const t=new Date(y,m-1+d,1);return t.getFullYear()+'-'+p2(t.getMonth()+1)})();R()}
function calPick(d){ui.sel=d;R()}
function calGrid(){
 const cm=ui.cm||today().slice(0,7),[y,m]=cm.split('-').map(Number),off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate(),n=Math.ceil((off+dim)/7)*7,t=today();
 let h=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('');
 for(let i=0;i<n;i++){
  const d=i-off+1;if(d<1||d>dim){h+='<div class="cd leer"></div>';continue}
  const date=cm+'-'+p2(d),ev=db.events.filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  h+=`<button class="cd ${date===t?'heute':''} ${date===ui.sel?'sel':''}" onclick="calPick('${date}')" aria-label="${d}. ${MN[m-1]}, ${ev.length} Termine"><b>${d}</b>`+ev.slice(0,3).map(e=>`<span class="ce ${e.done?'done':''}">${e.time?esc(e.time)+' ':''}${esc(e.title)}</span>`).join('')+(ev.length>3?`<span class="cm">+${ev.length-3} weitere</span>`:'')+`</button>`;
 }
 return `<div class="calnav"><button class="ghost" onclick="calGo(-1)" aria-label="Vorheriger Monat">‹</button><h2>${MN[m-1]} ${y}</h2><button class="ghost" onclick="calGo(1)" aria-label="Nächster Monat">›</button><button class="ghost" onclick="calGo(0)">Heute</button></div><div class="cg">${h}</div>`;
}

function addEvent(f){if(!f.title.value.trim()||!f.date.value)return false;db.events.push({id:uid(),title:f.title.value.trim(),date:f.date.value,time:f.time.value,done:false});ui.cm=f.date.value.slice(0,7);ui.sel=f.date.value;save();R();return false}

/* ---------- Produkte ---------- */
function setPrice(id,v){const p=db.products.find(x=>x.id===id);const n=num(v);p.price=isNaN(n)?null:n;p.changed=today();save();R()}
function setAv(id,a){db.products.find(x=>x.id===id).avail=a;save();R()}
function addProd(i){
 const cat=[...new Set(db.products.map(p=>p.cat))][i];const name=prompt('Name des Produkts in '+cat+':');if(!name)return;
 const price=num(prompt('Preis in Euro (leer = auf Anfrage):')||'');
 const unit=confirm('Preis pro kg?\nOK = pro kg, Abbrechen = pro Stück')?'kg':'Stk';
 db.products.push({id:uid(),cat,name,price:isNaN(price)?null:price,unit,avail:'ja',changed:today()});save();R();
}
function addCat(){const c=prompt('Name der neuen Kategorie:');if(!c)return;const n=prompt('Erstes Produkt in '+c+':');if(!n)return;db.products.push({id:uid(),cat:c,name:n,price:null,unit:'Stk',avail:'ja',changed:today()});save();R()}

/* ---------- Kunden ---------- */
function addCust(f){const n=f.name.value.trim();if(!n)return false;db.customers.push({id:uid(),name:n,email:f.email.value,tel:f.tel.value,adr:f.adr.value,note:f.note.value});save();R();return false}
function upC(id,k,v){db.customers.find(x=>x.id===id)[k]=v;save()}

/* ---------- Bestellungen ---------- */
const F=['name','email','tel','adr','l','b','h','w'];
function readForm(){
 const d=ui.d;F.forEach(k=>{const e=$('#o_'+k);if(e)d[k]=e.value});
 const c=$('#o_cat');if(c)d.cat=c.value;const f=$('#o_f');if(f)d.fertig=f.checked;
}
function suggest(el){
 const v=el.value.trim().toLowerCase();if(!v)return;
 const c=db.customers.find(c=>[c.name,c.email,c.tel].some(x=>x&&x.toLowerCase()===v));
 if(!c)return;readForm();Object.assign(ui.d,{name:c.name,email:c.email||'',tel:c.tel||'',adr:c.adr||''});R();
}
function addItem(){
 readForm();const p=db.products.find(x=>x.id===$('#o_prod').value);if(!p)return;
 const q=num($('#o_qty').value);let t=num($('#o_tot').value);
 if(isNaN(t)&&p.price!=null&&!isNaN(q))t=Math.round(q*p.price*100)/100;
 if(isNaN(t)||isNaN(q)){alert('Bitte Menge ('+p.unit+') eingeben, oder direkt den Gesamtpreis.');return}
 ui.d.items.push({name:p.name,unit:p.unit,qty:q,total:t});R();
}
function rmItem(i){readForm();ui.d.items.splice(i,1);R()}
function addOCat(){const c=prompt('Neue Unterteilung:');if(!c)return;db.ocats.push(c);save();readForm();ui.d.cat=c;R()}
function saveOrder(){
 readForm();const d=ui.d;
 if(!d.name.trim()||!d.items.length){alert('Name und mindestens ein Produkt sind nötig.');return}
 if(!db.customers.some(c=>c.name.toLowerCase()===d.name.trim().toLowerCase()))db.customers.push({id:uid(),name:d.name.trim(),email:d.email,tel:d.tel,adr:d.adr,note:''});
 db.orders.unshift({id:uid(),date:today(),...d,name:d.name.trim(),done:false,shipped:false});
 ui.d=newDraft();ui.openForm=false;save();R();
}
const sum=items=>items.reduce((s,i)=>s+i.total,0);
function itemsTable(items,rm){return `<table>${items.map((i,n)=>`<tr><td>${esc(i.name)}</td><td class="n">${nf(i.qty).replace(',00','')} ${i.unit}</td><td class="n">${nf(i.total)} €</td>${rm?`<td><button class="x" onclick="rmItem(${n})" aria-label="entfernen">×</button></td>`:''}</tr>`).join('')}<tr><td colspan="2" class="sum">Gesamtsumme</td><td class="n sum">${nf(sum(items))} €</td>${rm?'<td></td>':''}</tr></table>`}
function setO(id,k,v){db.orders.find(x=>x.id===id)[k]=v;save();R()}

/* ---------- Arbeiten für Dritte ---------- */
function extSeed(){
 const P=[],a=(cat,u,l)=>l.forEach(n=>{const x=Array.isArray(n);P.push({id:uid(),cat,name:x?n[0]:n,unit:u,price:x?n[1]:null,changed:x?'2026-11-18':null})});
 a('Handarbeit','Std',[['Handarbeit',25]]);
 a('Maschinen','Std',[['Fendt 130 PS',55],['New Holland 90 PS',35],['New Holland 40 PS',25],'Carraro 100 PS','Bagger 5 t','Auto','Quad','Rasentraktor']);
 a('Anhänger','Std',['Wagen 14 t','Wagen 6 t','Wagen 2 t','Autoanhänger 3,5 t','Autoanhänger klein']);
 a('Anbaugeräte','Std',[['Hacker',50],'Schlegelmulcher','Messermulcher','Mulcher für Bagger','Schneeschild Fendt','Schneeschild Manitou','Planierschild']);
 a('Motorsägen','Std',['Motorsäge','Rückenmäher']);
 a('Sonstiges','m³',['Hackschnitzel < 50 m³','Hackschnitzel > 50 m³']);
 a('Sonstiges','Std',['Schneeketten Fendt vorn','Schneeketten Fendt hinten','Schneeketten Manitou']);
 return{prices:P,ext:[],kvs:[],qn:0};
}
const kn=(e,p)=>e.prices[p.id]!=null?e.prices[p.id]:p.price;
const jt=j=>j.lines.reduce((s,l)=>s+l.h*l.pr,0);
const cn=e=>(db.customers.find(c=>c.id===e.cid)||{}).name||'?';
const conf2=m=>confirm(m)&&confirm('Bitte nochmals bestätigen:\n'+m);
const fe=id=>db.ext.find(x=>x.id===id);
function det(k,t,b,cls=''){return `<details class="${cls}" ${ui.o&&ui.o[k]?'open':''} ontoggle="(ui.o=ui.o||{})['${k}']=this.open"><summary>${t}</summary>${b}</details>`}
function setBase(id,v){const p=db.prices.find(x=>x.id===id),n=num(v);p.price=isNaN(n)?null:n;p.changed=today();save();R()}
function addSvc(i){const cat=[...new Set(db.prices.map(p=>p.cat))][i],n=prompt('Neue Leistung in '+cat+':');if(!n)return;db.prices.push({id:uid(),cat,name:n,unit:prompt('Einheit (z. B. Std, m³):','Std')||'Std',price:null,changed:null});save();R()}
function openExt(){const s=$('#x_new');if(!s.value)return;db.ext.push({id:uid(),cid:s.value,prices:{},jobs:[]});save();R()}
function newExt(){const n=prompt('Name des neuen Kunden:');if(!n)return;const c={id:uid(),name:n.trim(),email:'',tel:'',adr:'',note:''};db.customers.push(c);db.ext.push({id:uid(),cid:c.id,prices:{},jobs:[]});save();R()}
function setCP(eid,pid,v){const e=fe(eid),p=db.prices.find(x=>x.id===pid),n=num(v);
 if(isNaN(n)||n===kn(e,p)){R();return}
 if(!conf2('Preis für '+cn(e)+' ('+p.name+') auf '+nf(n)+' € ändern?')){R();return}
 if(n===p.price)delete e.prices[pid];else e.prices[pid]=n;save();R()}
function addJob(eid){
 const e=fe(eid),w=$('#w_'+eid).value.trim(),d=$('#d_'+eid).value||today(),L=[];
 db.prices.forEach(p=>{const i=$('#h_'+eid+'_'+p.id),h=i?num(i.value):NaN;if(h>0)L.push({name:p.name,unit:p.unit,h,pr:kn(e,p)})});
 if(!w||!L.length){alert('Bitte eintragen, was getan wurde, und bei mindestens einer Leistung die Menge.');return}
 e.jobs.push({id:uid(),what:w,date:d,lines:L,qid:null});save();R()}
function moveJob(eid,jid){const e=fe(eid),j=e.jobs.find(x=>x.id===jid),t=$('#mv_'+jid).value;if(!t)return;const T=fe(t);
 if(!conf2('„'+j.what+'“ zu '+cn(T)+' verschieben?'))return;
 e.jobs=e.jobs.filter(x=>x!==j);T.jobs.push(j);save();R()}
function delJob(eid,jid){const e=fe(eid),j=e.jobs.find(x=>x.id===jid);if(j.qid){alert('Die Arbeit ist in einem Kostenvoranschlag. Zuerst dort entfernen.');return}if(!confirm('Arbeit löschen?'))return;e.jobs=e.jobs.filter(x=>x!==j);save();R()}
function mkKV(eid,all){
 const e=fe(eid),ids=[...document.querySelectorAll('.jsel_'+eid+':checked')].map(x=>x.value),fr=e.jobs.filter(j=>!j.qid),sel=all?fr:fr.filter(j=>ids.includes(j.id)),t=$('#kt_'+eid).value;
 if(!sel.length){alert('Keine Arbeiten ausgewählt.');return}
 let k=t==='new'?null:db.kvs.find(x=>x.id===t);
 if(!k){db.qn=(db.qn||0)+1;k={id:uid(),eid,no:'KV '+new Date().getFullYear()+'/'+String(db.qn).padStart(3,'0'),date:today(),confirmed:false,paid:false};db.kvs.push(k)}
 sel.forEach(j=>j.qid=k.id);save();R()}
function rmKV(eid,jid){const e=fe(eid),j=e.jobs.find(x=>x.id===jid),q=j.qid;j.qid=null;if(!e.jobs.some(x=>x.qid===q))db.kvs=db.kvs.filter(k=>k.id!==q);save();R()}
function okKV(id){const k=db.kvs.find(x=>x.id===id);if(!conf2(k.no+' bestätigen? Danach kann er nicht mehr geändert werden und die Arbeiten verschwinden aus der Gesamtübersicht.'))return;k.confirmed=true;k.date=today();save();R()}
function paidKV(id){const k=db.kvs.find(x=>x.id===id);k.paid=!k.paid;save();R()}
function pdfKV(id){
 const k=db.kvs.find(x=>x.id===id),e=fe(k.eid),c=db.customers.find(x=>x.id===e.cid)||{},J=e.jobs.filter(j=>j.qid===id);
 $('#pr').innerHTML=`<h1>Kostenvoranschlag ${esc(k.no)}</h1><p>${fmtD(k.date)}<br>${esc(c.name)}<br>${esc(c.adr||'')}</p><table>`+J.map(j=>`<tr><td colspan="3"><strong>${esc(j.what)}</strong> (${fmtD(j.date)})</td></tr>`+j.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${nf(l.h)} ${l.unit} × ${nf(l.pr)} €</td><td class="n">${nf(l.h*l.pr)} €</td></tr>`).join('')).join('')+`<tr><td colspan="2" class="sum">Gesamt</td><td class="n sum">${nf(J.reduce((s,j)=>s+jt(j),0))} €</td></tr></table><p>${k.paid?'Bezahlt':'Noch nicht bezahlt'}</p>`;
 document.title=k.no.replace('/','-')+' '+(c.name||'');window.print();
}
function extBox(e){
 const KS=db.kvs.filter(k=>k.eid===e.id),vis=e.jobs.filter(j=>{const k=KS.find(k=>k.id===j.qid);return !(k&&k.confirmed)}),tot=vis.reduce((s,j)=>s+jt(j),0),cats=[...new Set(db.prices.map(p=>p.cat))];
 const form=det('n'+e.id,'Neue Arbeit eintragen',`<div class="row"><input id="w_${e.id}" placeholder="Was wurde getan?" style="flex:1;min-width:12rem"><input type="date" id="d_${e.id}" value="${today()}"></div>`+cats.map((c,ci)=>det('f'+e.id+ci,esc(c),`<table>${db.prices.filter(p=>p.cat===c).map(p=>{const pr=kn(e,p);return `<tr><td>${esc(p.name)}</td><td class="n">${pr==null?'<small>Preis fehlt (in der Preisliste eintragen)</small>':`<input id="h_${e.id}_${p.id}" size="4" placeholder="${p.unit}"> ${nf(pr)} €/${p.unit}`}</td></tr>`}).join('')}</table>`,'sub')).join('')+`<p><button onclick="addJob('${e.id}')">Arbeit speichern</button></p>`);
 const cp=det('p'+e.id,'Preise dieses Kunden',`<table>${db.prices.map(p=>{const v=kn(e,p),ind=e.prices[p.id]!=null&&e.prices[p.id]!==p.price;return `<tr><td>${esc(p.name)}</td><td class="n"><input class="pr ${ind?'ind':''}" value="${v==null?'':nf(v)}" placeholder="Preis" onchange="setCP('${e.id}','${p.id}',this.value)" aria-label="Preis ${esc(p.name)}"> €/${p.unit}</td></tr>`}).join('')}</table>`);
 const jl=vis.map(j=>{const k=KS.find(k=>k.id===j.qid);return `<div class="job ${k?'inkv':''}"><div class="row">${k?'':`<input type="checkbox" class="jsel_${e.id}" value="${j.id}" aria-label="auswählen">`}<strong>${esc(j.what)}</strong><small>${fmtD(j.date)}</small>${k?`<span class="tag">in ${esc(k.no)}</span>`:''}<span style="flex:1"></span><strong>${nf(jt(j))} €</strong><button class="x" onclick="delJob('${e.id}','${j.id}')" aria-label="löschen">×</button></div><small>${j.lines.map(l=>`${esc(l.name)}: ${nf(l.h)} ${l.unit} × ${nf(l.pr)} €`).join('; ')}</small>${k?'':`<div class="row"><select id="mv_${j.id}"><option value="">Verschieben nach …</option>${db.ext.filter(x=>x.id!==e.id).map(x=>`<option value="${x.id}">${esc(cn(x))}</option>`).join('')}</select><button class="ghost" onclick="moveJob('${e.id}','${j.id}')">Verschieben</button></div>`}</div>`}).join('');
 const dr=KS.filter(k=>!k.confirmed),fr=e.jobs.some(j=>!j.qid);
 const ctl=fr?`<div class="row"><select id="kt_${e.id}"><option value="new">Neuer Kostenvoranschlag</option>${dr.map(k=>`<option value="${k.id}">zu ${esc(k.no)} hinzufügen</option>`).join('')}</select><button class="ghost" onclick="mkKV('${e.id}',false)">Ausgewählte aufnehmen</button><button class="ghost" onclick="mkKV('${e.id}',true)">Alle offenen aufnehmen</button></div>`:'';
 const kvh=KS.map(k=>{const jj=e.jobs.filter(j=>j.qid===k.id);return `<div class="box"><div class="row"><strong>${esc(k.no)}</strong><small>${fmtD(k.date)}</small><span class="tag">${k.confirmed?(k.paid?'bezahlt':'noch nicht bezahlt'):'Entwurf'}</span><span style="flex:1"></span><strong>${nf(jj.reduce((s,j)=>s+jt(j),0))} €</strong></div>${jj.map(j=>`<div class="row"><span>${esc(j.what)} (${fmtD(j.date)})</span><span style="flex:1"></span>${nf(jt(j))} €${k.confirmed?'':`<button class="x" onclick="rmKV('${e.id}','${j.id}')" aria-label="entfernen">×</button>`}</div>`).join('')}<div class="row">${k.confirmed?`<button class="ghost" onclick="paidKV('${k.id}')">${k.paid?'Als unbezahlt markieren':'Als bezahlt markieren'}</button>`:`<button onclick="okKV('${k.id}')">Bestätigen</button>`}<button class="ghost" onclick="pdfKV('${k.id}')">Als PDF speichern</button></div></div>`}).join('');
 return `<div class="box"><h2 style="margin-top:0">${esc(cn(e))}</h2>${form}${cp}<h3>Gesamtübersicht</h3>${jl||'<p class="empty">Keine offenen Arbeiten.</p>'}<div class="row sum"><span style="flex:1">Summe offen</span>${nf(tot)} €</div>${ctl}${kvh?`<h3>Kostenvoranschläge</h3>${kvh}`:''}</div>`;
}

/* ---------- Ansichten ---------- */
const V={
 home(){
  const open=allTasks().filter(t=>!t.done).sort((a,b)=>a.p-b.p).slice(0,10);
  return `<h1>Anstehende Arbeiten</h1>`+(open.length?`<ul class="tl">${open.map(row).join('')}</ul>`:'<p class="empty">Nichts offen. Neue Arbeiten legst du unter „Arbeiten“ an.</p>');
 },
 tasks(){
  const a=allTasks();
  let h=`<h1>Arbeiten</h1><form onsubmit="return addTask(this)" class="row"><input name="text" placeholder="Neue Arbeit" required style="flex:1;min-width:12rem"><select name="p"><option value="1">Hohe Priorität</option><option value="2" selected>Mittlere Priorität</option><option value="3">Niedrige Priorität</option></select><button>Hinzufügen</button></form>`;
  [1,2,3].forEach(p=>{const l=a.filter(t=>t.p===p&&!t.done);if(l.length)h+=`<h2>${PL[p]}</h2><ul class="tl">${l.map(row).join('')}</ul>`});
  const d=a.filter(t=>t.done);if(d.length)h+=`<h2>Erledigt</h2><ul class="tl">${d.map(row).join('')}</ul>`;
  return h;
 },
 cal(){
  const ev=[...db.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),sel=ui.sel||today(),sd=ev.filter(e=>e.date===sel);
  const li=e=>`<li class="task ev ${e.done?'done':''}"><span></span><div><span>${esc(e.title)}</span><small>${fmtD(e.date)}${e.time?', '+e.time+' Uhr':''}</small></div><span></span><button class="x" onclick="del('e','${e.id}')" aria-label="löschen">×</button></li>`;
  return `<h1>Kalender</h1>${calGrid()}<form onsubmit="return addEvent(this)" class="row"><input name="title" placeholder="Termin" required style="flex:1;min-width:10rem"><input type="date" name="date" value="${sel}" required><input type="time" name="time"><button>Termin eintragen</button></form>`+
  `<h2>Termine am ${fmtD(sel)}</h2>`+(sd.length?`<ul class="tl">${sd.map(li).join('')}</ul>`:'<p class="empty">An diesem Tag ist nichts eingetragen.</p>')+
  `<h2>Alle Termine</h2>`+(ev.length?`<ul class="tl">${ev.map(li).join('')}</ul>`:'<p class="empty">Noch keine Termine.</p>')+
  `<p><small>Termine erscheinen automatisch unter „Arbeiten“: ab 2 Wochen vorher mit mittlerer, 2 Tage vorher mit hoher Priorität.</small></p>`;
 },
 orders(){
  const d=ui.d,av=db.products.filter(p=>p.avail==='ja'),cats=[...new Set(av.map(p=>p.cat))];
  const form=`<form onsubmit="return false"><div class="row"><input id="o_name" list="cl" placeholder="Name" value="${esc(d.name)}" onchange="suggest(this)"><datalist id="cl">${db.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><input id="o_email" placeholder="E-Mail" value="${esc(d.email)}" onchange="suggest(this)"><input id="o_tel" placeholder="Telefon" value="${esc(d.tel)}" onchange="suggest(this)"><input id="o_adr" placeholder="Adresse" value="${esc(d.adr)}" style="flex:1;min-width:12rem"></div>`+
  `<div class="row"><select id="o_cat" onchange="readForm();R()">${db.ocats.map(c=>`<option ${c===d.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><button type="button" class="ghost" onclick="addOCat()" aria-label="Unterteilung hinzufügen">+</button></div>`+
  (d.cat==='Pakete'?`<div class="row"><input id="o_l" size="5" placeholder="Länge cm" value="${esc(d.l)}"><input id="o_b" size="5" placeholder="Breite cm" value="${esc(d.b)}"><input id="o_h" size="5" placeholder="Höhe cm" value="${esc(d.h)}"><input id="o_w" size="5" placeholder="Gewicht kg" value="${esc(d.w)}"><label><input type="checkbox" id="o_f" ${d.fertig?'checked':''}> Paket ist fertig</label></div>`:'')+
  `<div class="row"><select id="o_prod">${cats.map(c=>`<optgroup label="${esc(c)}">${av.filter(p=>p.cat===c).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.price==null?'auf Anfrage':nf(p.price)+' €/'+p.unit})</option>`).join('')}</optgroup>`).join('')}</select><input id="o_qty" size="6" placeholder="kg / Stück"><input id="o_tot" size="8" placeholder="oder Gesamtpreis €"><button type="button" onclick="addItem()">Hinzufügen</button></div>`+
  (d.items.length?itemsTable(d.items,true):'')+`<div class="row"><button type="button" onclick="saveOrder()">Bestellung speichern</button></div></form>`;
  const list=db.orders.map(o=>`<div class="box ${o.done?'done-o':''}"><div class="row"><strong>${esc(o.name)}</strong><small>${esc(o.cat)}, ${fmtD(o.date)}</small><span style="flex:1"></span><button class="ghost" onclick="setO('${o.id}','done',${!o.done})">${o.done?'Wieder öffnen':'Als erledigt markieren'}</button><button class="x" onclick="del('o','${o.id}')" aria-label="löschen">×</button></div><small>${[o.email,o.tel,o.adr].filter(Boolean).map(esc).join(', ')}</small>`+
   (o.cat==='Pakete'?`<small>Paket: ${esc(o.l)}×${esc(o.b)}×${esc(o.h)} cm, ${esc(o.w)} kg <label><input type="checkbox" ${o.fertig?'checked':''} onchange="setO('${o.id}','fertig',this.checked)"> fertig</label></small>`:'')+itemsTable(o.items)+`</div>`).join('');
  return `<h1>Bestellungen</h1><h2>Neue Bestellung</h2>${form}<h2>Alle Bestellungen</h2>${list||'<p class="empty">Noch keine Bestellungen.</p>'}`;
 },
 products(){
  const cats=[...new Set(db.products.map(p=>p.cat))];
  return `<h1>Produkte</h1>`+cats.map((c,i)=>`<h2>${esc(c)}</h2><table>${db.products.filter(p=>p.cat===c).map(p=>`<tr class="${p.avail==='aus'?'dim':''}"><td>${esc(p.name)}</td><td class="n"><input class="pr" value="${p.price==null?'':nf(p.price)}" placeholder="Anfrage" onchange="setPrice('${p.id}',this.value)" aria-label="Preis"> €/${p.unit}<small>${p.changed?'geändert '+fmtD(p.changed):''}</small></td><td class="av">${[['ja','verfügbar'],['nein','nicht verfügbar'],['aus','ausgeblendet']].map(([a,l])=>`<label><input type="radio" name="a${p.id}" ${p.avail===a?'checked':''} onchange="setAv('${p.id}','${a}')"> ${l}</label>`).join('')}</td></tr>`).join('')}</table><p><button class="ghost" onclick="addProd(${i})">+ Produkt hinzufügen</button></p>`).join('')+`<p><button onclick="addCat()">+ Neue Kategorie</button></p>`;
 },
 ext(){
  const cats=[...new Set(db.prices.map(p=>p.cat))];
  const base=det('pl','Preisliste (Grundpreise)',cats.map((c,i)=>`<h3>${esc(c)}</h3><table>${db.prices.filter(p=>p.cat===c).map(p=>`<tr><td>${esc(p.name)}</td><td class="n"><input class="pr" value="${p.price==null?'':nf(p.price)}" placeholder="Preis" onchange="setBase('${p.id}',this.value)" aria-label="Preis ${esc(p.name)}"> €/${p.unit}<small>${p.changed?'geändert '+fmtD(p.changed):'Preis fehlt'}</small></td></tr>`).join('')}</table><button class="ghost" onclick="addSvc(${i})">+ Leistung hinzufügen</button>`).join(''));
  const fr=db.customers.filter(c=>!db.ext.some(e=>e.cid===c.id));
  const top=`<div class="row"><select id="x_new"><option value="">Kunde aus der Liste öffnen</option>${fr.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button onclick="openExt()">Öffnen</button><button class="ghost" onclick="newExt()">+ Neuer Kunde</button></div>`;
  return `<h1>Arbeiten für Dritte</h1>${base}<h2>Kunden</h2>${top}`+(db.ext.length?db.ext.map(extBox).join(''):'<p class="empty">Noch kein Kunde geöffnet.</p>');
 },
 customers(){
  return `<h1>Kunden</h1><form onsubmit="return addCust(this)"><div class="row"><input name="name" placeholder="Name" required><input name="email" placeholder="E-Mail"><input name="tel" placeholder="Telefon"><input name="adr" placeholder="Adresse"></div><div class="row"><input name="note" placeholder="Notiz" style="flex:1"><button>Kunde anlegen</button></div></form>`+
  (db.customers.length?db.customers.map(c=>`<div class="box"><div class="row"><input value="${esc(c.name)}" onchange="upC('${c.id}','name',this.value)" aria-label="Name"><input value="${esc(c.email)}" placeholder="E-Mail" onchange="upC('${c.id}','email',this.value)"><input value="${esc(c.tel)}" placeholder="Telefon" onchange="upC('${c.id}','tel',this.value)"><input value="${esc(c.adr)}" placeholder="Adresse" onchange="upC('${c.id}','adr',this.value)"><span style="flex:1"></span><button class="x" onclick="del('c','${c.id}')" aria-label="löschen">×</button></div><input value="${esc(c.note)}" placeholder="Notiz" style="width:100%" onchange="upC('${c.id}','note',this.value)"></div>`).join(''):'<p class="empty">Noch keine Kunden.</p>');
 }
};
const NAV=[['home','Start'],['tasks','Arbeiten'],['cal','Kalender'],['orders','Bestellungen'],['products','Produkte'],['ext','Für Dritte'],['customers','Kunden']];
function go(v){view=v;R();scrollTo(0,0)}
function R(){
 $('#nav').innerHTML=`<div class="logo">Hofplaner</div>`+NAV.map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#main').innerHTML=V[view]();
}
window.onafterprint=()=>{document.title='Hofplaner'};
R();
</script>
</body>
</html>
